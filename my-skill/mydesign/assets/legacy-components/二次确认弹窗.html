<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>删除产品弹窗</title>
    <style>
        /* 遮罩层 */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        /* 弹窗容器 */
        .modal-wrap {
            width: 540px;
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 32px;
            box-sizing: border-box;
            text-align: center;
        }
        /* 顶部红色叉号圆形图标 */
        .modal-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fde8e8;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-icon span {
            color: #e53e3e;
            font-size:34px;
            font-weight:bold;
        }
        /* 弹窗标题 */
        .modal-title {
            font-size:28px;
            font-weight:700;
            color:#111111;
            margin:0 0 20px;
        }
        /* 无红框，黑字左对齐 */
        .modal-desc {
            font-size:17px;
            color:#222222;
            line-height:1.6;
            text-align: left;
            margin-bottom:20px;
        }
        /* 浅黄色重要提醒区域 */
        .modal-highlight {
            background-color: #fff9e6;
            border-radius:12px;
            padding:16px 20px;
            text-align:left;
            margin-bottom:32px;
        }
        .modal-highlight .tip-label {
            color:#d97706;
            font-weight:600;
            font-size:18px;
            display:flex;
            align-items:center;
            gap:6px;
            margin-bottom:8px;
        }
        .modal-highlight .tip-text {
            color:#333333;
            font-size:16px;
        }
        /* 按钮容器 */
        .btn-wrap {
            display:flex;
            gap:20px;
            justify-content:center;
        }
        .btn-cancel {
            width:140px;
            padding:14px 0;
            border:1px solid #d1d5db;
            background:#fff;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
        }
        .btn-delete {
            width:140px;
            padding:14px 0;
            border:none;
            background:#2563eb;
            color:#fff;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="modal-mask">
        <div class="modal-wrap">
            <div class="modal-icon">
                <span>×</span>
            </div>
            <h3 class="modal-title">确认删除产品</h3>
            <!-- 取消红框，保持文字左对齐 -->
            <p class="modal-desc">
                删除该产品后，此产品下所有视频素材将被永久删除，操作无法恢复。
            </p>
            <div class="modal-highlight">
                <span class="tip-label">⚠️ 重要提醒</span>
                <span class="tip-text">素材删除后不可找回，请确认是否继续操作。</span>
            </div>
            <div class="btn-wrap">
                <button class="btn-cancel">取消</button>
                <button class="btn-delete">确认删除</button>
            </div>
        </div>
    </div>
</body>
</html>
