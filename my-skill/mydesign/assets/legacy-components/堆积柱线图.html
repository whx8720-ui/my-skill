<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>近5周账号累积播放量与发布数</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #e6eaf0;
    --grid: #edf1f5;
    --text: #1f2a37;
    --muted: #7d8998;
    --blue: #3f6ff7;
    --blue-bg: #f3f6ff;
    --orange: #f5a623;
  }
  body {
    margin: 0;
    min-width: 980px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .page {
    padding: 14px 28px 28px;
  }
  .card {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: visible;
  }
  .header {
    min-height: 56px;
    padding: 11px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    border-bottom: 1px solid #eef1f5;
  }
  .title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
  }
  .title-icon {
    width: 13px;
    height: 13px;
    display: grid;
    grid-template-columns: repeat(4, 2px);
    gap: 1px;
    align-items: end;
  }
  .title-icon i { display:block; width:2px; background:#6b63ff; border-radius:1px; }
  .title-icon i:nth-child(1){height:8px}.title-icon i:nth-child(2){height:11px}.title-icon i:nth-child(3){height:6px}.title-icon i:nth-child(4){height:10px}
  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  /* searchable single-select */
  .select-wrap { position: relative; width: 260px; }
  .select-shell {
    height: 36px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    border: 1px solid #d8dfea;
    border-radius: 7px;
    background: #fff;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .select-shell:focus-within {
    border-color: #7da0ff;
    box-shadow: 0 0 0 3px rgba(63,111,247,.10);
  }
  .search-icon { width: 15px; height: 15px; flex: 0 0 auto; color: #94a0af; }
  .select-input {
    width: 100%;
    min-width: 0;
    border: 0;
    outline: 0;
    color: #3a4654;
    background: transparent;
    font-size: 13px;
    padding: 0;
  }
  .select-input::placeholder { color:#a7b0bc; }
  .select-arrow {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    display: grid;
    place-items: center;
    color: #8f99a8;
    cursor: pointer;
    user-select: none;
  }
  .options {
    position: absolute;
    z-index: 50;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    max-height: 278px;
    padding: 5px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #dde3ec;
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(31,42,55,.14);
    display: none;
  }
  .options.open { display:block; }
  .option {
    width: 100%;
    min-height: 34px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 9px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #4a5665;
    text-align: left;
    font-size: 13px;
    cursor: pointer;
  }
  .option:hover, .option.active { background:#f3f6fb; }
  .option.selected { color:#315fe9; background:#f2f6ff; }
  .option-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background:#b9c0ca; }
  .option-name { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .empty { padding: 24px 8px; color:#9aa4b1; text-align:center; font-size:13px; }

  .download-btn {
    height: 36px;
    padding: 0 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid #b9caff;
    border-radius: 7px;
    background: var(--blue-bg);
    color: #4567ed;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .download-btn:hover { background:#eaf0ff; }
  .download-btn svg { width:14px; height:14px; }

  .chart-area { position: relative; padding: 22px 18px 10px; }
  #chart { width: 100%; height: 320px; display:block; overflow:visible; }
  .tooltip {
    position: absolute;
    z-index: 40;
    min-width: 190px;
    max-width: 280px;
    padding: 10px 12px;
    border-radius: 4px;
    background: rgba(26, 35, 52, .96);
    color: #fff;
    font-size: 12px;
    line-height: 1.65;
    box-shadow: 0 5px 16px rgba(16,24,40,.24);
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .08s ease, transform .08s ease;
  }
  .tooltip.show { opacity:1; transform:translateY(0); }
  .tooltip strong { font-weight:700; }
  .tooltip .tip-title { font-weight:700; margin-bottom:2px; }

  .footer-note {
    padding: 0 22px 14px;
    color: #9aa4b1;
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="page">
  <section class="card">
    <header class="header">
      <div class="title">
        <span class="title-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>近5周账号累积播放量与发布数</span>
      </div>
      <div class="actions">
        <div class="select-wrap" id="accountSelect">
          <div class="select-shell">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
            <input id="accountInput" class="select-input" type="text" autocomplete="off" value="全部账号" aria-label="搜索并选择账号" />
            <span class="select-arrow" id="selectArrow" aria-hidden="true">⌄</span>
          </div>
          <div class="options" id="options" role="listbox"></div>
        </div>
        <button class="download-btn" id="downloadBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7.5 10.5 4.5 4.5 4.5-4.5"></path><path d="M5 20h14"></path></svg>
          下载图片
        </button>
      </div>
    </header>

    <div class="chart-area" id="chartArea">
      <svg id="chart" viewBox="0 0 1120 320" role="img" aria-label="近5周账号累积播放量与发布数图表"></svg>
      <div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>
    </div>
    <div class="footer-note">账号筛选：默认展示全部账号；搜索并选择具体账号后，仅显示该账号柱状数据。</div>
  </section>
</div>

<script>
(() => {
  'use strict';
  const weeks = ['8.10-8.16', '8.17-8.23', '8.24-8.30', '8.31-9.6', '9.7-9.13'];
  const publishLine = [75, 83, 85, 70, 88];
  const totalLabels = [755.9, 909.2, 1296.7, 576.9, 822.3];

  // 单位：万播放量。数据用于复刻视觉及交互，可替换为真实接口数据。
  const accounts = [
    { name:'原神大才', color:'#4f8df7', views:[210.0, 198.0, 262.0, 86.0, 292.0], posts:[8,7,9,4,10] },
    { name:'プロキシ星人【ゼンレスゾーン】', color:'#42c4e8', views:[112.0, 155.0, 236.0, 62.0, 138.0], posts:[5,6,8,4,6] },
    { name:'巫女ちゃん@原神', color:'#a45ce6', views:[105.0, 126.0, 181.0, 74.0, 150.0], posts:[6,7,8,4,7] },
    { name:'攻略-银河攻略组', color:'#11b56b', views:[88.0, 112.0, 217.0, 115.0, 72.0], posts:[5,6,10,6,4] },
    { name:'センユーの秘玩', color:'#f07a22', views:[54.0, 72.0, 90.0, 48.0, 42.0], posts:[4,5,6,3,3] },
    { name:'黒塔-hsr/Hertadol...', color:'#ef4444', views:[38.0, 56.0, 66.0, 42.0, 36.0], posts:[3,4,5,3,3] },
    { name:'リッカ@タロ工探案中', color:'#19b6a4', views:[31.0, 42.0, 58.0, 34.0, 27.0], posts:[3,4,4,3,2] },
    { name:'BangbooMemes', color:'#9756e8', views:[35.0, 48.0, 53.0, 31.0, 24.0], posts:[3,4,4,3,2] },
    { name:'スタレ愛☆Family（x）', color:'#3f7fe5', views:[28.0, 35.0, 45.0, 29.0, 18.0], posts:[2,3,3,2,2] },
    { name:'childheimself原神公子', color:'#46c4e5', views:[30.0, 38.0, 41.0, 40.5, 15.0], posts:[4,5,5,6,3] },
    { name:'小三月-saycheesem...', color:'#8f59df', views:[24.9, 27.2, 47.7, 15.4, 6.3], posts:[3,3,5,2,1] }
  ];

  // 确保各周总量与截图顶部标注一致：把差额并入最后一个账号。
  for (let w = 0; w < weeks.length; w++) {
    const current = accounts.reduce((sum, a) => sum + a.views[w], 0);
    accounts[accounts.length - 1].views[w] += +(totalLabels[w] - current).toFixed(1);
  }

  const svg = document.getElementById('chart');
  const tooltip = document.getElementById('tooltip');
  const chartArea = document.getElementById('chartArea');
  const input = document.getElementById('accountInput');
  const options = document.getElementById('options');
  const wrap = document.getElementById('accountSelect');
  const arrow = document.getElementById('selectArrow');
  const downloadBtn = document.getElementById('downloadBtn');

  let selected = '全部账号';
  let optionIndex = -1;

  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs = {}, text = '') {
    const node = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k, v));
    if (text !== '') node.textContent = text;
    return node;
  }
  function clearSvg() { while (svg.firstChild) svg.removeChild(svg.firstChild); }
  function fmtViews(v) {
    const n = Number(v);
    return `${n.toFixed(1).replace(/\.0$/, '')}万`;
  }
  function getAccount(name) { return accounts.find(a => a.name === name); }

  function renderChart() {
    clearSvg();
    const W = 1120, H = 320;
    const margin = {left:60, right:62, top:30, bottom:48};
    const plotW = W - margin.left - margin.right;
    const plotH = H - margin.top - margin.bottom;
    const leftMax = 2183;
    const rightMax = 108;
    const yLeft = v => margin.top + plotH - (v / leftMax) * plotH;
    const yRight = v => margin.top + plotH - (v / rightMax) * plotH;
    const groupStep = plotW / weeks.length;
    const xCenter = i => margin.left + groupStep * (i + .5);
    const barW = 46;

    // defs
    const defs = el('defs');
    const filter = el('filter', {id:'shadow', x:'-30%', y:'-30%', width:'160%', height:'160%'});
    filter.appendChild(el('feDropShadow', {'dx':'0','dy':'1.5','stdDeviation':'1.5','flood-color':'#334155','flood-opacity':'0.12'}));
    defs.appendChild(filter);
    svg.appendChild(defs);

    // grid + left axis labels
    const leftTicks = [0,500,1000,1500,2000,2183];
    leftTicks.forEach((v, idx) => {
      const y = yLeft(v);
      svg.appendChild(el('line', {x1:margin.left, x2:W-margin.right, y1:y, y2:y, stroke:'#edf1f5', 'stroke-width':'1'}));
      const label = idx === 0 ? '0w' : `${v}w`;
      svg.appendChild(el('text', {x:margin.left-10, y:y+4, 'text-anchor':'end', fill:'#8190a4', 'font-size':'11'}, label));
    });

    // right axis labels
    [0,18,36,54,72,90,108].forEach(v => {
      const y = yRight(v);
      svg.appendChild(el('text', {x:W-margin.right+10, y:y+4, 'text-anchor':'start', fill:'#8190a4', 'font-size':'11'}, String(v)));
    });

    // x-axis
    weeks.forEach((wk, i) => {
      const x = xCenter(i);
      svg.appendChild(el('text', {x, y:H-19, 'text-anchor':'middle', fill:'#64748b', 'font-size':'11'}, wk));
    });

    // bars
    const shown = selected === '全部账号' ? accounts : [getAccount(selected)].filter(Boolean);
    weeks.forEach((wk, wi) => {
      let cumulative = 0;
      shown.forEach(acc => {
        const v = Math.max(0, Number(acc.views[wi]) || 0);
        if (!v) return;
        const yTop = yLeft(cumulative + v);
        const yBottom = yLeft(cumulative);
        const rect = el('rect', {
          x:xCenter(wi)-barW/2,
          y:yTop,
          width:barW,
          height:Math.max(1, yBottom-yTop),
          fill:acc.color,
          rx:'1.5',
          'data-week':String(wi),
          'data-account':acc.name,
          style:'cursor:pointer;transition:opacity .12s ease;'
        });
        rect.addEventListener('mouseenter', e => {
          rect.setAttribute('opacity','.82');
          const posts = acc.posts[wi] || 0;
          const avg = posts ? v / posts : 0;
          showTooltip(e, `<div class="tip-title">周次：${wk}</div><div>账号名称：<strong>${escapeHtml(acc.name)}</strong></div><div>总播放量：<strong>${fmtViews(v)}</strong></div><div>总产出：<strong>${posts}</strong></div><div>平均播放量：<strong>${fmtViews(avg)}</strong></div>`);
        });
        rect.addEventListener('mousemove', moveTooltip);
        rect.addEventListener('mouseleave', () => { rect.setAttribute('opacity','1'); hideTooltip(); });
        svg.appendChild(rect);
        cumulative += v;
      });

      const topValue = selected === '全部账号' ? totalLabels[wi] : (shown[0]?.views[wi] || 0);
      const topY = yLeft(topValue);
      svg.appendChild(el('text', {
        x:xCenter(wi), y:Math.max(17, topY-8), 'text-anchor':'middle',
        fill:selected === '全部账号' ? '#5b61e8' : (shown[0]?.color || '#5b61e8'),
        'font-size':'11', 'font-weight':'700'
      }, fmtViews(topValue)));
    });

    // line path
    const points = publishLine.map((v,i) => [xCenter(i), yRight(v)]);
    const d = points.map((p,i) => `${i===0?'M':'L'} ${p[0]} ${p[1]}`).join(' ');
    svg.appendChild(el('path', {d, fill:'none', stroke:'#f5a623', 'stroke-width':'2'}));
    points.forEach(([x,y], i) => {
      const c = el('circle', {cx:x, cy:y, r:'4.4', fill:'#fff', stroke:'#f5a623', 'stroke-width':'1.8', style:'cursor:pointer;'});
      c.addEventListener('mouseenter', e => showTooltip(e, `<div class="tip-title">周次：${weeks[i]}</div><div>发布数：<strong>${publishLine[i]}</strong></div>`));
      c.addEventListener('mousemove', moveTooltip);
      c.addEventListener('mouseleave', hideTooltip);
      svg.appendChild(c);
      svg.appendChild(el('text', {x, y:y-12, 'text-anchor':'middle', fill:'#ef8e00', 'font-size':'11', 'font-weight':'700'}, String(publishLine[i])));
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }
  function showTooltip(e, html) {
    tooltip.innerHTML = html;
    tooltip.classList.add('show');
    moveTooltip(e);
  }
  function moveTooltip(e) {
    const rect = chartArea.getBoundingClientRect();
    const tt = tooltip.getBoundingClientRect();
    let left = e.clientX - rect.left + 14;
    let top = e.clientY - rect.top - 12;
    if (left + tt.width > rect.width - 8) left = e.clientX - rect.left - tt.width - 14;
    if (top + tt.height > rect.height - 8) top = rect.height - tt.height - 8;
    if (top < 8) top = 8;
    tooltip.style.left = `${left}px`;
    tooltip.style.top = `${top}px`;
  }
  function hideTooltip() { tooltip.classList.remove('show'); }

  function optionList(query = '') {
    const q = query.trim().toLowerCase();
    const items = ['全部账号', ...accounts.map(a => a.name)].filter(n => !q || n.toLowerCase().includes(q));
    options.innerHTML = '';
    optionIndex = -1;
    if (!items.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '未找到相关账号';
      options.appendChild(empty);
      return;
    }
    items.forEach(name => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `option${name === selected ? ' selected' : ''}`;
      btn.setAttribute('role','option');
      btn.setAttribute('aria-selected', name === selected ? 'true' : 'false');
      const dot = document.createElement('span');
      dot.className = 'option-dot';
      const acc = getAccount(name);
      dot.style.background = acc ? acc.color : '#7c8aa0';
      const nm = document.createElement('span');
      nm.className = 'option-name';
      nm.textContent = name;
      btn.append(dot, nm);
      btn.addEventListener('mousedown', e => e.preventDefault());
      btn.addEventListener('click', () => choose(name));
      options.appendChild(btn);
    });
  }
  function openOptions(query = '') {
    optionList(query);
    options.classList.add('open');
  }
  function closeOptions() {
    options.classList.remove('open');
    optionIndex = -1;
    input.value = selected;
  }
  function choose(name) {
    selected = name;
    input.value = name;
    closeOptions();
    renderChart();
  }

  input.addEventListener('focus', () => {
    input.select();
    openOptions('');
  });
  input.addEventListener('input', () => openOptions(input.value));
  input.addEventListener('keydown', e => {
    const buttons = [...options.querySelectorAll('.option')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!options.classList.contains('open')) openOptions(input.value);
      if (!buttons.length) return;
      optionIndex += e.key === 'ArrowDown' ? 1 : -1;
      if (optionIndex < 0) optionIndex = buttons.length - 1;
      if (optionIndex >= buttons.length) optionIndex = 0;
      buttons.forEach((b,i) => b.classList.toggle('active', i === optionIndex));
      buttons[optionIndex].scrollIntoView({block:'nearest'});
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (optionIndex >= 0 && buttons[optionIndex]) buttons[optionIndex].click();
      else if (buttons.length === 1) buttons[0].click();
    } else if (e.key === 'Escape') {
      closeOptions(); input.blur();
    }
  });
  arrow.addEventListener('click', () => {
    if (options.classList.contains('open')) closeOptions();
    else { input.focus(); openOptions(''); }
  });
  document.addEventListener('mousedown', e => { if (!wrap.contains(e.target)) closeOptions(); });

  downloadBtn.addEventListener('click', () => {
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', NS);
    clone.setAttribute('width','1120');
    clone.setAttribute('height','320');
    const bg = el('rect', {x:'0', y:'0', width:'1120', height:'320', fill:'#ffffff'});
    clone.insertBefore(bg, clone.firstChild);
    const source = new XMLSerializer().serializeToString(clone);
    const blob = new Blob([source], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 2240;
      canvas.height = 640;
      const ctx = canvas.getContext('2d');
      ctx.scale(2,2);
      ctx.drawImage(img,0,0,1120,320);
      URL.revokeObjectURL(url);
      const a = document.createElement('a');
      a.download = `近5周账号播放量_${selected === '全部账号' ? '全部账号' : selected.replace(/[\\/:*?"<>|]/g,'_')}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    };
    img.src = url;
  });

  renderChart();
})();
</script>
</body>
</html>
