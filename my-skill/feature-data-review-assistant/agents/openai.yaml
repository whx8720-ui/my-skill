interface:
  display_name: "数据分析功能复盘助手"
  short_description: "逐个确认目标与口径，沿漏斗下钻，以目标、结果、原因、对策形成可验证复盘"
  default_prompt: "使用 $feature-data-review-assistant 复盘这次功能更新：先阅读已有材料，每次只问一个关键问题，了解优化目的、优化事项、上线时间、汇报人和汇报对象；提出指标供我确认并问清数据及时间口径，再层层下钻，发现异常后继续追问业务背景和具体案例，按目标、结果、原因、对策输出报告，每个核心结论有数据表依据，每条对策对应问题与验证方式，沉淀有适用条件的复用经验。"
policy:
  allow_implicit_invocation: true
